n_envs: 4
checkpoint_freq: 50000

stages:
  - name: goal_following
    timesteps: 100000
    env:
      obstacle_count: 0
      obstacle_speed_range: [0.0, 0.0]
      max_episode_steps: 400

  - name: sparse_dynamic
    timesteps: 150000
    env:
      obstacle_count: 2
      obstacle_speed_range: [0.10, 0.35]
      max_episode_steps: 450

  - name: nominal_dynamic
    timesteps: 300000
    env:
      obstacle_count: 5
      obstacle_speed_range: [0.15, 0.55]
      max_episode_steps: 500

  - name: dense_fast
    timesteps: 250000
    env:
      obstacle_count: 7
      obstacle_speed_range: [0.20, 0.65]
      max_episode_steps: 550
