# 探索性配置（未完成）：R1/R2/R3 用于单障碍由慢到快的课程试验，
# 不属于 W0/W1/W2 计划中的正式路线，也不能作为 Webots 正式结果。
# policy_transfer_model 和 preferred_resume_model 是本机恢复提示；对应 checkpoint
# 不随仓库提供。R1/R2/R3 的阶段门禁只能生成探索性选择证据；只有另外满足
# 正式巡检的 20 回合、success >= 0.75、collision <= 0.15 固定门槛，并生成绑定
# 评测模型路径、variant 与 SHA-256 的 manifest 后，checkpoint 才能进入正式巡检。
schema_version: 1
transfer_model: artifacts/models/ppo_curriculum_seed11_stage2_nominal_dynamic.zip
policy_transfer_model: artifacts/models/webots/seed_11/ppo_webots_s11_step000050176.zip
policy_transfer_model_sha256: 91bc5dffe05566cbfcbf1fb2cab4588cdc54115c779f377e7aeea8428c4c2441
model_variant: curriculum_v2
port_base: 12920
validation:
  split: validation
  seed_start: 5000
  episodes: 20
  min_success_rate: 0.75
  max_collision_rate: 0.25
stages:
  - id: R1
    name: single_slow_obstacle
    obstacle_count: 1
    training_steps: 50000
    validation:
      min_success_rate: 0.75
      max_collision_rate: 0.25
    controller_env:
      WEBOTS_RUN_ID: r1_slow
      WEBOTS_OBSTACLE_SPEED_MIN: "0.05"
      WEBOTS_OBSTACLE_SPEED_MAX: "0.15"
