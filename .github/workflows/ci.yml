name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Test WeChat mini-program
        run: npm test --prefix wechat-miniprogram
      - name: Test and build CloudBase relay
        env:
          PATROL_CONTRACT_FORCE_TRACKED_FIXTURE: "1"
        run: |
          npm test --prefix cloudfunctions
          npm run build --prefix cloudfunctions
          npm run verify:bundles --prefix cloudfunctions
