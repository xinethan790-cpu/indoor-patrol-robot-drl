seed_sets:
  validation:
    start: 5000
    count: 20
  test:
    start: 10000
    count: 20

planners:
  - reactive
  - dwa
  - ppo

models:
  ppo: artifacts/models/ppo_curriculum_seed11_stage2_nominal_dynamic.zip

backend:
  kinematic:
    defaults:
      width: 10.0
      height: 8.0
      lidar_beams: 36
      lidar_range: 6.0
      obstacle_count: 5
      obstacle_speed_range: [0.15, 0.55]
      max_episode_steps: 500
      dt: 0.1

conditions:
  - id: G0
    map: train_a
    obstacle_density: train
    obstacle_speed: train
    kinematic: {}
  - id: G1
    map: unseen_b
    obstacle_density: train
    obstacle_speed: train
    kinematic:
      width: 9.0
      height: 9.0
  - id: G2
    map: train_a
    obstacle_density: high
    obstacle_speed: train
    kinematic:
      obstacle_count: 8
  - id: G3
    map: train_a
    obstacle_density: train
    obstacle_speed: high
    kinematic:
      obstacle_speed_range: [0.45, 0.85]

metrics:
  - success
  - collision
  - timeout
  - completion_time
  - path_efficiency
  - minimum_clearance
  - action_smoothness
  - inference_latency_p95
