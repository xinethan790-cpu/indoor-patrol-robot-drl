# R2b targeted fine-tuning preregistration.
# The frozen R2a model-plus-shield system passed the fixed 100-episode gate at
# 88% success / 12% collision / 0 timeout / 0 error.  Resume its immutable copy
# with SHA-256 verification so R2b retains the optimizer and learned action std.
schema_version: 1
transfer_model: artifacts/models/ppo_curriculum_seed11_stage2_nominal_dynamic.zip
model_variant: r2b_targeted_v1
port_base: 13320
validation:
  split: validation
  seed_start: 5000
  episodes: 100
  min_success_rate: 0.75
  max_collision_rate: 0.25
stages:
  - id: R2B
    name: single_medium_high_targeted
    obstacle_count: 1
    training_steps: 40960
    preferred_resume_model: artifacts/models/webots/seed_11/r2b_targeted_v1/sources/ppo_webots_s11_r2b_targeted_v1_source_r2a_v2_10240_steps.zip
    preferred_resume_sha256: 051d1e2f07bb147d247c91ded821e58af5b87987bedc2cee4e287fdbdfcdcbe0
    controller_env:
      WEBOTS_RUN_ID: r2b_targeted
      WEBOTS_OBSTACLE_SPEED_MIN: "0.18"
      WEBOTS_OBSTACLE_SPEED_MAX: "0.25"
      WEBOTS_HORIZONTAL_ROUTE_HALF_LENGTH: "1.10"
      WEBOTS_VERTICAL_ROUTE_HALF_LENGTH: "1.10"
      WEBOTS_SAFETY_SHIELD: "true"
      WEBOTS_SAFETY_SHIELD_FRONT_STOP_DISTANCE: "0.24"
      WEBOTS_SAFETY_SHIELD_FRONT_SLOWDOWN_DISTANCE: "0.75"
      WEBOTS_SAFETY_SHIELD_SIDE_STOP_DISTANCE: "0.12"
      WEBOTS_SAFETY_SHIELD_SIDE_SLOWDOWN_DISTANCE: "0.32"
      WEBOTS_SAFETY_SHIELD_FRONT_HALF_ANGLE: "1.0471975511965976"
      WEBOTS_SAFETY_SHIELD_SIDE_INNER_ANGLE: "1.0471975511965976"
      WEBOTS_SAFETY_SHIELD_SIDE_OUTER_ANGLE: "1.8325957145940461"
      WEBOTS_SAFETY_SHIELD_CLEARANCE_QUANTILE: "0.0"
