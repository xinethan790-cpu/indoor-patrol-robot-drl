# R2C stage-1 density adaptation preregistration (2026-09-02).
#
# The exact RB2B endpoint passed its locked single-obstacle validation gate but
# failed the post-hoc three-obstacle stress arm. This stage resumes an immutable
# copy of that endpoint, preserving the optimizer and learned action
# distribution. Relative to RB2B, only the run identity, validation seed window
# and dynamic-obstacle count change; speed, reward, PPO, route and safety-shield
# settings remain fixed.
schema_version: 1
transfer_model: artifacts/models/webots/seed_11/r2c_density2_v1/sources/ppo_webots_s11_r2c_density2_v1_source_r2b_rebaseline_v1_81920_steps.zip
require_clean_git: true
model_variant: r2c_density2_v1
port_base: 14420
validation:
  split: validation
  seed_start: 8200
  episodes: 100
  min_success_rate: 0.75
  max_collision_rate: 0.25
stages:
