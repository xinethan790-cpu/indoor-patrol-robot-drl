[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "indoor-patrol-robot-drl"
version = "0.1.0"
description = "Deep reinforcement learning for dynamic obstacle avoidance by an indoor patrol robot."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gymnasium>=1.3,<2",
  "numpy>=2.0,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
train = [
  "stable-baselines3>=2.9,<3",
  "tensorboard>=2.20,<3",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
video = [
  "Pillow>=11,<13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"indoor_patrol_rl.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
