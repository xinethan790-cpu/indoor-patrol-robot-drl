map:
  origin: [-2.25, -1.75]
  size: [4.5, 3.5]
  resolution: 0.10
  # Keep the A* centreline outside the pinned front-brake component's
  # near-stop region around the central cabinet without over-inflating walls.
  obstacle_inflation_radius: 0.38
  border_inflation_radius: 0.15
  static_rectangles:
    - id: central_cabinet
      center: [0.0, 0.0]
      size: [1.20, 0.80]

robot_start: [-1.60, 0.0]

checkpoints:
  - id: P1
    position: [1.60, 0.0]
  - id: P2
    # Keep the inspection dwell point outside the horizontal obstacle lane at y=0.60.
    position: [1.60, 1.30]
  - id: P3
    position: [-1.60, 1.30]
  - id: P4
    position: [-1.60, -1.15]
