# R2b targeted fine-tuning preregistration.
# Start this stage only after an R2a checkpoint passes the fixed 100-episode gate.
# The selected R2a model is copied, with SHA-256 verification, into this variant's
# sources directory.  Fill preferred_resume_model with that immutable step-encoded
# path before launching so R2b retains R2a's optimizer and learned action std.
schema_version: 1
transfer_model: artifacts/models/ppo_curriculum_seed11_stage2_nominal_dynamic.zip
model_variant: r2b_targeted_v1
port_base: 13320
validation:
  split: validation
  seed_start: 5000
  episodes: 100
  min_success_rate: 0.75
  max_collision_rate: 0.25
stages:
  - id: R2B
    name: single_medium_high_targeted
    obstacle_count: 1
    training_steps: 40960
    # Populated only after R2a validation-only checkpoint selection.
    preferred_resume_model:
    controller_env:
      WEBOTS_RUN_ID: r2b_targeted
      WEBOTS_OBSTACLE_SPEED_MIN: "0.18"
      WEBOTS_OBSTACLE_SPEED_MAX: "0.25"
      WEBOTS_HORIZONTAL_ROUTE_HALF_LENGTH: "1.10"
      WEBOTS_VERTICAL_ROUTE_HALF_LENGTH: "1.10"
      WEBOTS_SAFETY_SHIELD: "false"
      WEBOTS_REWARD_SAFETY_DISTANCE: "0.35"
      WEBOTS_REWARD_PROXIMITY_DISTANCE: "0.60"
      WEBOTS_REWARD_PROXIMITY_SPEED_WEIGHT: "0.80"
      WEBOTS_REWARD_SAFETY_WEIGHT: "-0.60"
      WEBOTS_REWARD_SMOOTHNESS_WEIGHT: "-0.005"
      WEBOTS_REWARD_GOAL: "30.0"
      WEBOTS_REWARD_COLLISION_PENALTY: "-30.0"
      WEBOTS_REWARD_TIMEOUT_PENALTY: "-5.0"
      WEBOTS_PPO_N_STEPS: "2048"
      WEBOTS_PPO_BATCH_SIZE: "128"
      WEBOTS_PPO_N_EPOCHS: "5"
      WEBOTS_PPO_LEARNING_RATE: "0.00003"
      WEBOTS_PPO_ENT_COEF: "0.001"
      WEBOTS_PPO_GAMMA: "0.995"
      WEBOTS_PPO_TARGET_KL: "0.02"
