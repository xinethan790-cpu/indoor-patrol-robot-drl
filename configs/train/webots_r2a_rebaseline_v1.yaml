# Verified R2a rebaseline preregistration (2026-09-02).
#
# This run starts from the exact kinematic model and 80 PPO validation rows bound
# by webots_r2a_rebaseline_v1_warm_start_requirement.yaml.  It deliberately uses
# a new model variant and fresh Webots validation seeds so no legacy R2a/R2b
# output can be silently reused.  The safety shield is part of the evaluated
# system during both training and validation; results are not policy-only claims.
schema_version: 1
transfer_model: artifacts/models/ppo_curriculum_seed11_stage2_nominal_dynamic.zip
policy_transfer_model: artifacts/models/ppo_curriculum_seed11_stage2_nominal_dynamic.zip
warm_start_requirement: configs/models/webots_r2a_rebaseline_v1_warm_start_requirement.yaml
require_clean_git: true
model_variant: r2a_rebaseline_v1
port_base: 14120
validation:
  split: validation
  seed_start: 6000
  episodes: 100
  min_success_rate: 0.75
  max_collision_rate: 0.25
stages:
  - id: RB2A
    name: verified_single_medium_low_policy_shield_baseline
    obstacle_count: 1
    training_steps: 40960
    controller_env:
      WEBOTS_RUN_ID: r2a_rebaseline_v1
      WEBOTS_OBSTACLE_SPEED_MIN: "0.10"
      WEBOTS_OBSTACLE_SPEED_MAX: "0.20"
      WEBOTS_HORIZONTAL_ROUTE_HALF_LENGTH: "1.10"
      WEBOTS_VERTICAL_ROUTE_HALF_LENGTH: "1.10"
      WEBOTS_SAFETY_SHIELD: "true"
      WEBOTS_SAFETY_SHIELD_FRONT_STOP_DISTANCE: "0.24"
      WEBOTS_SAFETY_SHIELD_FRONT_SLOWDOWN_DISTANCE: "0.75"
      WEBOTS_SAFETY_SHIELD_SIDE_STOP_DISTANCE: "0.12"
      WEBOTS_SAFETY_SHIELD_SIDE_SLOWDOWN_DISTANCE: "0.32"
      WEBOTS_SAFETY_SHIELD_FRONT_HALF_ANGLE: "1.0471975511965976"
      WEBOTS_SAFETY_SHIELD_SIDE_INNER_ANGLE: "1.0471975511965976"
      WEBOTS_SAFETY_SHIELD_SIDE_OUTER_ANGLE: "1.8325957145940461"
      WEBOTS_SAFETY_SHIELD_CLEARANCE_QUANTILE: "0.0"
      WEBOTS_SAFETY_SHIELD_SIDE_SPEED_FLOOR: "1.0"
      WEBOTS_SAFETY_SHIELD_SIDE_TURN_WEIGHT: "0.55"
      WEBOTS_SAFETY_SHIELD_TURN_GAIN: "0.9"
      WEBOTS_SAFETY_SHIELD_TURN_BLEND: "0.0"
      WEBOTS_SAFETY_SHIELD_SIDE_DEADBAND: "0.03"
      WEBOTS_SAFETY_SHIELD_INTERVENTION_EPSILON: "1e-06"
      WEBOTS_REWARD_SAFETY_DISTANCE: "0.35"
      WEBOTS_REWARD_PROXIMITY_DISTANCE: "0.70"
      WEBOTS_REWARD_PROXIMITY_SPEED_WEIGHT: "0.80"
      WEBOTS_REWARD_SAFETY_WEIGHT: "-0.60"
      WEBOTS_REWARD_SMOOTHNESS_WEIGHT: "-0.005"
      WEBOTS_REWARD_GOAL: "30.0"
      WEBOTS_REWARD_COLLISION_PENALTY: "-30.0"
      WEBOTS_REWARD_TIMEOUT_PENALTY: "-5.0"
      WEBOTS_PPO_N_STEPS: "2048"
      WEBOTS_PPO_BATCH_SIZE: "128"
      WEBOTS_PPO_N_EPOCHS: "5"
      WEBOTS_PPO_LEARNING_RATE: "0.00003"
      WEBOTS_PPO_ENT_COEF: "0.001"
      WEBOTS_PPO_GAMMA: "0.995"
      WEBOTS_PPO_TARGET_KL: "0.02"
      WEBOTS_PPO_INITIAL_ACTION_STD: "0.45"
